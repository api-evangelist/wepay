name: WePay
description: WePay is a payments platform, founded in 2008 and backed by 500 Global and Y Combinator,
  that provided integrated payments (payment processing, merchant onboarding, and payouts) embedded
  inside software platforms and online marketplaces. WePay was acquired by JPMorgan Chase in 2017 and
  its capabilities were folded into Chase Integrated Payments (WePay Clear and WePay Link). As of this
  enrichment pass the standalone WePay developer platform has been decommissioned. developer.wepay.com
  serves a deleted storage bucket, api.wepay.com is unreachable, www.wepay.com redirects to a dead
  landing page, and all wepay.com TLS certificates have expired, so no live public API surface remains.
